[project]
name = "tidewise"
version = "0.1.0"
description = "An MCP server for Canadian tide and water level data, with a small agent CLI and evals."
readme = "README.md"
authors = [
    { name = "Andy He", email = "andy-he@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "tzdata>=2026.6",
]

[project.scripts]
tidewise = "tidewise.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines of HTML are easier to read as they are than split up.
"src/tidewise/report.py" = ["E501"]
"src/tidewise/site.py" = ["E501"]
"src/tidewise/live.py" = ["E501"]
"src/tidewise/traceview.py" = ["E501"]
