name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 6 hours: rebuild so the Today page uses fresh tides and weather.
    - cron: "20 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Build the demo site (eval runs, plus live tides and weather for the Today page)
        run: uv run tidewise site --out site --bench --live
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
